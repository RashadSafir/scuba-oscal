[client]
# Never show raw tracebacks in the UI.
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "light"
font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "0.5rem"
baseFontSize = 15

primaryColor = "#2446A8"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#EAEEF4"
textColor = "#0E1B2C"
borderColor = "#D9DFE8"
linkColor = "#2446A8"
codeTextColor = "#0E1B2C"
codeBackgroundColor = "#EAEEF4"
greenColor = "#1F7A5A"
redColor = "#B3261E"
blueColor = "#2446A8"

[theme.sidebar]
backgroundColor = "#0E1B2C"
secondaryBackgroundColor = "#1A2A40"
textColor = "#DCE3EE"
primaryColor = "#3A63D8"
borderColor = "#2A3C57"
greenColor = "#5FC49A"
greenBackgroundColor = "#15352D"
greenTextColor = "#8FDDB9"
codeBackgroundColor = "#1A2A40"
